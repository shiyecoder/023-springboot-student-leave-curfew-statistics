<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>角色管理 · 学生请销假与晚归统计管理系统</title>

<body><div class="layout">
<aside class="sidebar">
  <div class="brand"><span class="dot">勤</span>学生安全请假平台</div>
  <nav class="nav"><div class="nav-group">管理端 · 系统治理</div><a href="admin-dashboard.html" class=""><span class="ic">◧</span>数据看板</a><a href="admin-rules.html" class=""><span class="ic">⚙</span>请假规则配置</a><a href="admin-users.html" class=""><span class="ic">☰</span>用户管理</a><a href="admin-roles.html" class="on"><span class="ic">◎</span>角色管理</a><a href="admin-menus.html" class=""><span class="ic">≡</span>菜单管理</a>
   <div class="nav-group">个人</div>
   <a href="common-profile.html"><span class="ic">◍</span>个人中心</a>
  </nav>
  <div style="padding:12px 16px;font-size:11px;color:#7C8798;border-top:1px solid #ffffff14">v1.0 · 管理视图</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="crumb">管理端 / <b>角色管理</b></div>
    <div class="topright">
      <span class="bell">消息<i>6</i></span><span>帮助</span>
      <span class="who"><img class="ava" src="assets/avatar-1.jpg" alt="">系统管理员 admin</span>
    </div>
  </header>
  <div class="content"><div class="pagehead"><div><h1>角色管理</h1><p>5 个角色 · 数据范围分为本人 / 本班级 / 本院系 / 全校</p></div><div class="row"><button class="btn primary">新增角色</button></div></div>
<div class="grid2">
  <div class="card"><div class="card-title"><span class="bar"></span>角色列表</div>
  <div class="table-wrap"><table><thead><tr><th>角色编码</th><th>角色名称</th><th>数据范围</th><th>用户数</th><th>操作</th></tr></thead><tbody><tr><td><span class='code'>STUDENT</span></td><td>学生</td><td>本人</td><td>1,204</td><td><span class='ops'><a>分配菜单</a><a>编辑</a></span></td></tr><tr><td><span class='code'>COUNSELOR</span></td><td>辅导员 / 班主任</td><td>本班级</td><td>42</td><td><span class='ops'><a>分配菜单</a><a>编辑</a></span></td></tr><tr><td><span class='code'>DEPT_HEAD</span></td><td>院系学工负责人</td><td>本院系</td><td>12</td><td><span class='ops'><a>分配菜单</a><a>编辑</a></span></td></tr><tr><td><span class='code'>DORM</span></td><td>宿管值班员</td><td>本楼栋</td><td>18</td><td><span class='ops'><a>分配菜单</a><a>编辑</a></span></td></tr><tr><td><span class='code'>ADMIN</span></td><td>系统管理员</td><td>全校</td><td>3</td><td><span class='ops'><a>分配菜单</a><a>编辑</a></span></td></tr></tbody></table></div></div>
  <div class="card"><div class="card-title"><span class="bar"></span>为「辅导员」分配菜单</div>
    <div style="border:1px solid #E3E8EF;border-radius:4px;padding:12px">
      <div><label><input type="checkbox" checked> 审批工作台</label></div>
      <div style="padding-left:20px"><label><input type="checkbox" checked> 待我审批</label> <label><input type="checkbox" checked> 批量审批</label></div>
      <div class="mt8"><label><input type="checkbox" checked> 未归核查</label></div>
      <div style="padding-left:20px"><label><input type="checkbox" checked> 生成工单</label> <label><input type="checkbox"> 批量派发</label></div>
      <div class="mt8"><label><input type="checkbox" checked> 关怀记录</label></div>
      <div class="mt8"><label><input type="checkbox" checked> 班级统计</label></div>
      <div class="mt8" style="color:#6B7785"><label><input type="checkbox" disabled> 菜单管理（系统内置，不可分配）</label></div>
    </div>
    <div class="row mt"><button class="btn">重置</button><button class="btn primary">保存权限</button></div>
  </div>
</div></div>
</div></div></body></html>
